<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172a3a;
      --muted: #647587;
      --accent: #167c78;
      --accent-dark: #11635f;
      --line: #dce6e8;
      --surface: #ffffff;
      --focus: #e28b65;
    }

    * {
      box-sizing: border-box;
    }

    body {
      align-items: center;
      background:
        radial-gradient(ellipse at 12% 18%, rgba(117, 230, 202, 0.28), transparent 30%),
        radial-gradient(ellipse at 88% 82%, rgba(255, 176, 142, 0.25), transparent 32%),
        linear-gradient(135deg, #102b3f 0%, #1c5360 52%, #765b75 100%);
      background-attachment: fixed;
      display: flex;
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px;
    }

    #Login {
      background: var(--surface);
      border: 1px solid rgba(220, 230, 232, 0.9);
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(31, 57, 67, 0.12);
      max-width: 100%;
      padding: clamp(28px, 6vw, 48px);
      width: 440px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.14em;
      margin: 0 0 12px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(2rem, 7vw, 2.5rem);
      letter-spacing: -0.045em;
      margin: 0;
    }

    .intro {
      color: var(--muted);
      line-height: 1.6;
      margin: 10px 0 26px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 650;
      margin: 18px 0 8px;
    }

    input[type="email"],
    input[type="password"] {
      background: #fbfdfc;
      border: 1px solid #cbd9dc;
      border-radius: 10px;
      color: var(--ink);
      font: inherit;
      min-height: 48px;
      padding: 11px 13px;
      width: 100%;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(22, 124, 120, 0.12);
      outline: none;
    }

    .password-field {
      align-items: center;
      display: flex;
      position: relative;
    }

    .password-field input {
      min-width: 0;
      padding-right: 50px;
    }

    .password-toggle {
      align-items: center;
      background: transparent;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      padding: 8px;
      position: absolute;
      right: 7px;
    }

    .password-toggle svg {
      height: 21px;
      width: 21px;
    }

    .password-toggle:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    button {
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      min-height: 46px;
      padding: 10px 16px;
      transition: background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button[type="submit"] {
      background: var(--accent);
      box-shadow: 0 8px 18px rgba(22, 124, 120, 0.18);
      color: white;
      flex: 1;
    }

    button[type="submit"]:hover {
      background: var(--accent-dark);
    }

    button[type="reset"] {
      background: #f3f6f5;
      border-color: var(--line);
      color: var(--ink);
    }

    a {
      color: var(--accent-dark);
      font-weight: 650;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    a:hover {
      color: #0c4c49;
    }

    #login-error {
      color: #a63e38;
      font-size: 0.9rem;
      line-height: 1.45;
      min-height: 1.3em;
    }

    .secondary-links {
      border-top: 1px solid #edf1f0;
      margin-top: 24px;
      padding-top: 18px;
    }

    .secondary-links p {
      font-size: 0.92rem;
      margin: 8px 0;
    }

    .demo-note {
      background: #fbf7f1;
      border-radius: 10px;
      color: #76624d;
      font-size: 0.78rem;
      line-height: 1.5;
      margin: 18px 0 0;
      padding: 10px 12px;
    }

    @media (max-width: 420px) {
      .form-actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main id="Login">
    <p class="eyebrow">Your space, your pace</p>
    <h1>Login</h1>
    <p class="intro">Sign in with your email and password to continue.</p>

    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>

      <label for="password">Password</label>
      <div class="password-field">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="password-toggle" type="button" data-toggle-password-for="password"
          aria-label="Show password" aria-pressed="false" title="Show password">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"></path>
            <circle cx="12" cy="12" r="3"></circle>
            <path class="eye-slash" d="M3 3l18 18" style="display: none;"></path>
          </svg>
        </button>
      </div>

      <div class="form-actions">
        <button type="submit">Login now</button>
        <button type="reset">Clear</button>
      </div>
      <p id="login-error" role="alert" aria-live="polite"></p>
    </form>

    <div class="secondary-links">
      <p>New here? <a href="Registration.html">Create an account</a></p>
      <p><a href="Admin.html">Open admin dashboard</a></p>
    </div>
    <p class="demo-note">Your QR profile is public to anyone with its link. It includes your name, photo, email, gender, country, city, and address.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    const loginForm = document.getElementById("login-form");
    const loginError = document.getElementById("login-error");

    document.querySelectorAll("[data-toggle-password-for]").forEach((button) => {
      button.addEventListener("click", () => {
        const passwordInput = document.getElementById(button.dataset.togglePasswordFor);
        const isVisible = passwordInput.type === "text";
        const action = isVisible ? "Show" : "Hide";

        passwordInput.type = isVisible ? "password" : "text";
        button.setAttribute("aria-label", `${action} password`);
        button.setAttribute("title", `${action} password`);
        button.setAttribute("aria-pressed", String(!isVisible));
        button.querySelector(".eye-slash").style.display = isVisible ? "none" : "block";
      });
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      loginError.textContent = "";

      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;

      try {
        const { error } = await window.siteSupabase.auth.signInWithPassword({ email, password });
        if (error) {
          throw error;
        }
        window.location.href = "Mode.html";
      } catch (error) {
        loginError.textContent = error.message ||
          "Could not sign in. Check your email and password, then try again.";
        console.error("Could not sign in:", error);
      }
    });

    loginForm.addEventListener("reset", () => {
      loginError.textContent = "";
      const passwordInput = document.getElementById("password");
      const toggleButton = document.querySelector("[data-toggle-password-for='password']");
      passwordInput.type = "password";
      toggleButton.setAttribute("aria-label", "Show password");
      toggleButton.setAttribute("title", "Show password");
      toggleButton.setAttribute("aria-pressed", "false");
      toggleButton.querySelector(".eye-slash").style.display = "none";
    });
  </script>
</body>

</html>
