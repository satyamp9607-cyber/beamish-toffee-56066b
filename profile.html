<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102b3f">
    <title>User Profile</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #172a3a;
            --muted: #647587;
            --accent: #167c78;
            --line: #dce6e8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            align-items: center;
            background:
                radial-gradient(ellipse at 12% 18%, rgba(117, 230, 202, 0.28), transparent 30%),
                radial-gradient(ellipse at 88% 82%, rgba(255, 176, 142, 0.25), transparent 32%),
                linear-gradient(135deg, #102b3f 0%, #1c5360 52%, #765b75 100%);
            background-attachment: fixed;
            color: var(--ink);
            display: flex;
            font-family: "Segoe UI", Arial, sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 24px;
        }

        main {
            background: #fff;
            border: 1px solid rgba(220, 230, 232, 0.9);
            border-radius: 24px;
            box-shadow: 0 24px 70px rgba(31, 57, 67, 0.18);
            max-width: 620px;
            padding: clamp(24px, 6vw, 48px);
            width: 100%;
        }

        .eyebrow {
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 750;
            letter-spacing: 0.14em;
            margin: 0 0 10px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(2rem, 7vw, 2.8rem);
            letter-spacing: -0.045em;
            margin: 0 0 24px;
            overflow-wrap: anywhere;
        }

        #photo {
            border: 1px solid var(--line);
            border-radius: 18px;
            display: block;
            height: 180px;
            margin-bottom: 24px;
            object-fit: cover;
            width: 180px;
        }

        #photo[hidden] {
            display: none;
        }

        dl {
            display: grid;
            gap: 14px;
            grid-template-columns: minmax(110px, 0.35fr) minmax(0, 1fr);
            margin: 0;
        }

        dt {
            color: var(--muted);
            font-weight: 650;
        }

        dd {
            margin: 0;
            overflow-wrap: anywhere;
        }

        #message {
            color: var(--muted);
            line-height: 1.5;
        }

        #message.error {
            color: #a63e38;
        }

        @media (max-width: 420px) {
            dl {
                grid-template-columns: 1fr;
                gap: 4px;
            }

            dd {
                margin-bottom: 12px;
            }
        }
    </style>
</head>

<body>
    <main>
        <p class="eyebrow">Shared profile</p>
        <h1 id="name">Profile</h1>
        <img id="photo" alt="Profile photo" hidden>
        <p id="message" role="status" aria-live="polite"></p>

        <dl>
            <dt>Email</dt><dd id="email"></dd>
            <dt>Gender</dt><dd id="gender"></dd>
            <dt>Country</dt><dd id="country"></dd>
            <dt>City</dt><dd id="city"></dd>
            <dt>Address</dt><dd id="address"></dd>
        </dl>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script>
        const message = document.getElementById("message");

        function showError(text, error) {
            message.classList.add("error");
            message.textContent = text;
            if (error) {
                console.error("Could not load shared profile:", error);
            }
        }

        (async () => {
            try {
                const profileId = new URLSearchParams(window.location.search).get("id");
                const { data: { session }, error: authError } = await window.siteSupabase.auth.getSession();
                if (authError) {
                    throw authError;
                }
                const user = session && session.user;

                if (user) {
                    await window.uploadPendingProfilePhoto(user.id);
                }

                const requestedId = profileId || (user && user.id);
                if (!requestedId) {
                    throw new Error("This profile link is missing its ID.");
                }

                const { data, error } = await window.siteSupabase.rpc(
                    "get_public_profile",
                    { profile_id: requestedId }
                );
                if (error) {
                    throw error;
                }

                const profile = Array.isArray(data) ? data[0] : data;
                if (!profile) {
                    message.textContent =
                        "Profile not found or not yet public. The account owner may need to confirm their email.";
                    return;
                }

                document.getElementById("name").textContent = profile.name || "Profile";
                document.getElementById("email").textContent = profile.email || "";
                document.getElementById("gender").textContent = profile.gender || "Not provided";
                document.getElementById("country").textContent = profile.country || "Not provided";
                document.getElementById("city").textContent = profile.city || "Not provided";
                document.getElementById("address").textContent = profile.address || "Not provided";

                if (profile.photo_path) {
                    const { data: photo } = window.siteSupabase.storage
                        .from("profile-photos")
                        .getPublicUrl(profile.photo_path);
                    const photoElement = document.getElementById("photo");
                    photoElement.src = photo.publicUrl;
                    photoElement.hidden = false;
                }
                message.textContent = "";
            } catch (error) {
                showError(error.message || "Could not load this profile.", error);
            }
        })();
    </script>
</body>

</html>
