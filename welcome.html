<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    :root {
      --ink: #172a3a;
      --muted: #647587;
      --accent: #167c78;
      --accent-dark: #11635f;
      --line: #dce6e8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      align-items: center;
      background: radial-gradient(ellipse at 12% 18%, rgba(117, 230, 202, 0.28), transparent 30%),
        radial-gradient(ellipse at 88% 82%, rgba(255, 176, 142, 0.25), transparent 32%),
        linear-gradient(135deg, #102b3f 0%, #1c5360 52%, #765b75 100%);
      background-attachment: fixed;
      display: flex;
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
    }

    main {
      background: #fff;
      border: 1px solid rgba(220, 230, 232, 0.9);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(31, 57, 67, 0.12);
      max-width: 620px;
      padding: clamp(32px, 7vw, 64px);
      text-align: left;
      width: 100%;
    }

    .welcome-mark {
      align-items: center;
      background: #e7f3f0;
      border-radius: 16px;
      color: var(--accent-dark);
      display: flex;
      font-size: 1.3rem;
      font-weight: 800;
      height: 54px;
      justify-content: center;
      letter-spacing: -0.04em;
      margin-bottom: 28px;
      width: 54px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.14em;
      margin: 0 0 10px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(2.2rem, 8vw, 3.2rem);
      letter-spacing: -0.055em;
      line-height: 1.08;
      margin: 0;
      overflow-wrap: anywhere;
    }

    main > p:not(.eyebrow) {
      color: var(--muted);
      line-height: 1.65;
    }

    .welcome-actions {
      align-items: center;
      border-top: 1px solid #edf1f0;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 28px;
      padding-top: 22px;
    }

    a {
      color: var(--accent-dark);
      font-weight: 700;
      text-underline-offset: 4px;
    }

    .primary-link {
      background: var(--accent);
      border-radius: 10px;
      color: #fff;
      padding: 12px 16px;
      text-decoration: none;
    }

    .primary-link:hover {
      background: var(--accent-dark);
    }

    .delete-account {
      border-top: 1px solid #edf1f0;
      margin-top: 28px;
      padding-top: 22px;
    }

    .delete-account h2 {
      color: #a63e38;
      font-size: 1.1rem;
      margin: 0 0 8px;
    }

    .delete-account p {
      color: var(--muted);
      line-height: 1.5;
    }

    .delete-account label {
      display: block;
      font-weight: 650;
      margin: 16px 0 7px;
    }

    .delete-account input {
      border: 1px solid #cbd9dc;
      border-radius: 10px;
      color: var(--ink);
      font: inherit;
      min-height: 46px;
      padding: 10px 12px;
      width: 100%;
    }

    .delete-account input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(22, 124, 120, 0.12);
      outline: none;
    }

    .delete-account button {
      background: #a63e38;
      border: 0;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      margin-top: 12px;
      min-height: 44px;
      padding: 10px 15px;
    }

    .delete-account button:hover {
      background: #84322e;
    }

    #delete-error {
      color: #a63e38;
      min-height: 1.3em;
    }

    @media (max-width: 480px) {
      .welcome-actions {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="welcome-mark" aria-hidden="true">W</div>
    <p class="eyebrow">You are signed in</p>
    <h1 id="welcome-heading">Welcome!</h1>
    <p>Your account is ready. Make yourself at home.</p>
    <div class="welcome-actions">
      <a class="primary-link" href="Mode.html">Choose another mode</a>
      <a id="logout-link" href="login.html">Log out</a>
    </div>
    <section class="delete-account" aria-labelledby="delete-account-heading">
      <h2 id="delete-account-heading">Delete your account</h2>
      <p>This permanently removes your account and its registration details.</p>
      <form id="delete-account-form">
        <label for="delete-password">Confirm your password</label>
        <input id="delete-password" type="password" autocomplete="current-password" required>
        <button type="submit">Delete my account</button>
        <p id="delete-error" role="alert" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    const welcomeHeading = document.getElementById("welcome-heading");
    const deleteForm = document.getElementById("delete-account-form");
    const deleteError = document.getElementById("delete-error");
    let signedInUserId = "";

    document.getElementById("logout-link").addEventListener("click", async (event) => {
      event.preventDefault();
      try {
        const { error } = await window.siteSupabase.auth.signOut();
        if (error) {
          throw error;
        }
        window.location.href = "login.html";
      } catch (error) {
        deleteError.textContent = "Could not log out. Please try again.";
        console.error("Could not sign out:", error);
      }
    });

    (async () => {
      try {
        const { data: { session }, error: authError } = await window.siteSupabase.auth.getSession();
        if (authError) {
          throw authError;
        }
        const user = session && session.user;
        if (!user) {
          window.location.replace("login.html");
          return;
        }

        const { data: profile, error } = await window.siteSupabase
          .from("profiles")
          .select("name")
          .eq("id", user.id)
          .maybeSingle();
        if (error) {
          throw error;
        }
        if (!profile) {
          throw new Error("Your shared profile is not available yet. Confirm your email or contact the site administrator.");
        }
        signedInUserId = user.id;
        welcomeHeading.textContent = `Welcome, ${profile.name}!`;
      } catch (error) {
        welcomeHeading.textContent = "Unable to load your account.";
        console.error("Could not load signed-in account:", error);
      }
    })();

    deleteForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      deleteError.textContent = "";

      try {
        if (!signedInUserId) {
          throw new Error("Your account is not ready. Refresh the page and try again.");
        }

        const { data: { session }, error: authError } = await window.siteSupabase.auth.getSession();
        if (authError) {
          throw authError;
        }
        const user = session && session.user;
        if (!user || user.id !== signedInUserId || !user.email) {
          throw new Error("Your signed-in account could not be verified.");
        }

        if (!window.confirm("Permanently delete your account? This cannot be undone.")) {
          return;
        }

        const { error: passwordError } = await window.siteSupabase.auth.signInWithPassword({
          email: user.email,
          password: document.getElementById("delete-password").value
        });
        if (passwordError) {
          throw new Error("Incorrect password. Your account has not been deleted.");
        }

        const { data: profile, error: profileError } = await window.siteSupabase
          .from("profiles")
          .select("photo_path")
          .eq("id", signedInUserId)
          .maybeSingle();
        if (profileError) {
          throw profileError;
        }
        if (profile && profile.photo_path) {
          const { error: photoError } = await window.siteSupabase.storage
            .from("profile-photos")
            .remove([profile.photo_path]);
          if (photoError) {
            throw photoError;
          }
        }

        const { error: deleteError } = await window.siteSupabase.rpc("delete_own_account");
        if (deleteError) {
          throw deleteError;
        }
        const { error: signOutError } = await window.siteSupabase.auth.signOut();
        if (signOutError) {
          console.error("Account deleted, but could not clear the signed-in session:", signOutError);
        }
        window.location.replace("login.html");
      } catch (error) {
        deleteError.textContent = error.message || "Could not delete your account. Please try again.";
        console.error("Could not delete registered account:", error);
      }
    });
  </script>
</body>

</html>
