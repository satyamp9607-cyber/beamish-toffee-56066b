<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #172a3a;
            --muted: #647587;
            --accent: #167c78;
            --accent-dark: #11635f;
            --line: #dce6e8;
            --focus: #e28b65;
        }

        * {
            box-sizing: border-box;
        }

        body {
            align-items: center;
            background: radial-gradient(ellipse at 12% 18%, rgba(117, 230, 202, 0.28), transparent 30%),
                radial-gradient(ellipse at 88% 82%, rgba(255, 176, 142, 0.25), transparent 32%),
                linear-gradient(135deg, #102b3f 0%, #1c5360 52%, #765b75 100%);
            background-attachment: fixed;
            color: var(--ink);
            display: flex;
            font-family: "Segoe UI", Arial, sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 28px 16px;
        }

        #Registration {
            background: #fff;
            border: 1px solid rgba(220, 230, 232, 0.9);
            border-radius: 24px;
            box-shadow: 0 24px 70px rgba(31, 57, 67, 0.12);
            max-width: 920px;
            padding: clamp(24px, 5vw, 44px);
            width: 100%;
        }

        .eyebrow {
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 750;
            letter-spacing: 0.14em;
            margin: 0 0 10px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(1.9rem, 5vw, 2.5rem);
            letter-spacing: -0.045em;
            margin: 0;
        }

        .intro {
            color: var(--muted);
            line-height: 1.6;
            margin: 8px 0 26px;
        }

        .privacy-note {
            background: #fbf7f1;
            border-radius: 10px;
            color: #76624d;
            font-size: 0.88rem;
            line-height: 1.5;
            margin: 0 0 24px;
            padding: 12px 14px;
        }

        .form-grid {
            display: grid;
            gap: 18px 20px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .form-field label,
        .gender-field legend {
            color: #34495a;
            display: block;
            font-size: 0.88rem;
            font-weight: 650;
            margin-bottom: 8px;
        }

        .form-field input:not([type="radio"]) {
            background: #fbfdfc;
            border: 1px solid #cbd9dc;
            border-radius: 10px;
            color: var(--ink);
            font: inherit;
            min-height: 46px;
            padding: 10px 12px;
            width: 100%;
        }

        .form-field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(22, 124, 120, 0.12);
            outline: none;
        }

        .gender-field {
            border: 0;
            margin: 0;
            min-width: 0;
            padding: 0;
        }

        .gender-options {
            align-items: center;
            display: flex;
            gap: 18px;
            min-height: 46px;
        }

        .gender-options label {
            align-items: center;
            color: var(--muted);
            display: inline-flex;
            gap: 7px;
            margin: 0;
        }

        input[type="radio"] {
            accent-color: var(--accent);
            height: 16px;
            width: 16px;
        }

        .password-field {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-field input {
            padding-right: 48px !important;
        }

        .password-toggle {
            align-items: center;
            background: transparent;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            padding: 8px;
            position: absolute;
            right: 6px;
        }

        .password-toggle svg {
            height: 21px;
            width: 21px;
        }

        .password-toggle:focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 2px;
        }

        .form-actions {
            align-items: center;
            border-top: 1px solid #edf1f0;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 26px;
            padding-top: 22px;
        }

        button {
            border: 1px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            min-height: 46px;
            padding: 10px 18px;
        }

        button[type="submit"] {
            background: var(--accent);
            color: #fff;
        }

        button[type="submit"]:hover {
            background: var(--accent-dark);
        }

        button[type="reset"] {
            background: #f3f6f5;
            border-color: var(--line);
            color: var(--ink);
        }

        a {
            color: var(--accent-dark);
            font-weight: 650;
            margin-left: auto;
            text-underline-offset: 3px;
        }

        #registration-message {
            color: var(--accent-dark);
            line-height: 1.5;
            min-height: 1.4em;
        }

        @media (max-width: 620px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-actions {
                align-items: stretch;
                flex-direction: column;
            }

            .form-actions a {
                margin: 8px 0 0;
            }
        }
    </style>
</head>

<body>
        <main id="Registration">
            <p class="eyebrow">A few details to get started</p>
            <h1>Registration Form</h1>
            <p class="intro">Create your account by completing the details below.</p>
            <p class="privacy-note">Name, photo, email, gender, country, city, and address appear on your public QR profile. Do not enter details you want to keep private.</p>
            <form id="registration-form">
                <div class="form-grid">
                    <div class="form-field">
                        <label for="name">Name</label>
                        <input id="name" name="name" type="text" autocomplete="name" required>
                    </div>
                    <div class="form-field">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" autocomplete="email" required>
                    </div>
                    <div class="form-field">
                        <label for="password">Password</label>
                        <div class="password-field">
                            <input id="password" name="password" type="password" autocomplete="new-password" required>
                            <button class="password-toggle" type="button" data-toggle-password-for="password"
                                aria-label="Show password" aria-pressed="false" title="Show password">
                                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                    <path class="eye-slash" d="M3 3l18 18" style="display: none;"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="form-field">
                        <label for="confirm-password">Confirm Password</label>
                        <div class="password-field">
                            <input id="confirm-password" name="confirm-password" type="password"
                                autocomplete="new-password" required>
                            <button class="password-toggle" type="button"
                                data-toggle-password-for="confirm-password" aria-label="Show password"
                                aria-pressed="false" title="Show password">
                                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                    <path class="eye-slash" d="M3 3l18 18" style="display: none;"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <fieldset class="gender-field">
                        <legend>Gender <span>(optional)</span></legend>
                        <div class="gender-options">
                            <label for="gender-male"><input id="gender-male" type="radio" name="gender" value="male"> Male</label>
                            <label for="gender-female"><input id="gender-female" type="radio" name="gender" value="female"> Female</label>
                        </div>
                    </fieldset>
                    <div class="form-field">
                        <label for="country">Country</label>
                        <input id="country" name="country" type="text" autocomplete="country-name" required>
                    </div>
                    <div class="form-field">
                        <label for="city">City</label>
                        <input id="city" name="city" type="text" autocomplete="address-level2" required>
                    </div>
                    <div class="form-field">
                        <label for="address">Address</label>
                        <input id="address" name="address" type="text" autocomplete="street-address" required>
                    </div>
                    <div class="form-field">
                        <label for="phone">Phone Number</label>
                        <input id="phone" name="phone" type="tel" autocomplete="tel" required>
                    </div>
                    <div class="form-field">
                        <label for="photo">profile photo </label>
                        <input id="photo" name="photo" type="file"
                               accept="image/jpeg, image/png, image/webp" required>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit">Create account</button>
                    <button type="reset">Reset form</button>
                    <a href="login.html">Already registered? Log in</a>
                </div>
                <p id="registration-message" role="status" aria-live="polite"></p>
            </form>
        </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script>
        const registrationForm = document.getElementById("registration-form");
        const registrationMessage = document.getElementById("registration-message");
        const photoInput = document.getElementById("photo");

        document.querySelectorAll("[data-toggle-password-for]").forEach((button) => {
            button.addEventListener("click", () => {
                const passwordInput = document.getElementById(button.dataset.togglePasswordFor);
                const isVisible = passwordInput.type === "text";
                const action = isVisible ? "Show" : "Hide";

                passwordInput.type = isVisible ? "password" : "text";
                button.setAttribute("aria-label", `${action} password`);
                button.setAttribute("title", `${action} password`);
                button.setAttribute("aria-pressed", String(!isVisible));
                button.querySelector(".eye-slash").style.display = isVisible ? "none" : "block";
            });
        });

        registrationForm.addEventListener("reset", () => {
            document.querySelectorAll("[data-toggle-password-for]").forEach((button) => {
                const passwordInput = document.getElementById(button.dataset.togglePasswordFor);
                passwordInput.type = "password";
                button.setAttribute("aria-label", "Show password");
                button.setAttribute("title", "Show password");
                button.setAttribute("aria-pressed", "false");
                button.querySelector(".eye-slash").style.display = "none";
            });
        });

        registrationForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            registrationMessage.textContent = "";

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;

            const photoFile = photoInput.files[0];
            const allowedPhotoTypes = ["image/jpeg", "image/png", "image/webp"];

            if (!photoFile ||
                 !allowedPhotoTypes.includes(photoFile.type) || 
                 photoFile.size > 1_500_000){
                 registrationMessage.textContent = 
                     "Please select a valid profile photo (JPEG, PNG, or WebP) under 1.5 MB.";
                 return;
            }

            if (password !== confirmPassword) {
                registrationMessage.textContent = "The passwords do not match.";
                return;
            }

            try {
                const gender = registrationForm.querySelector( 
                    'input[name="gender"]:checked'
                );
                const { data, error } = await window.siteSupabase.auth.signUp({
                    email,
                    password,
                    options: {
                        emailRedirectTo: new URL("Profile.html", window.location.href).href,
                        data: {
                            name,
                            gender: gender ? gender.value : "",
                            country: document.getElementById("country").value.trim(),
                            city: document.getElementById("city").value.trim(),
                            address: document.getElementById("address").value.trim(),
                            phone: document.getElementById("phone").value.trim()
                        }
                    }
                });

                if (error) {
                    throw error;
                }
                if (!data.user) {
                    throw new Error("Supabase did not return the new account.");
                }

                if (data.session) {
                    await window.uploadProfilePhoto(data.user.id, photoFile);
                } else {
                    await window.savePendingProfilePhoto(data.user.id, photoFile);
                }

                registrationForm.reset();
                if (data.session) {
                    window.location.href = "Mode.html";
                } else {
                    registrationMessage.textContent =
                        "Account created. Confirm your email in this browser; your photo will upload when the link opens this site.";
                }
            } catch (error) {
                registrationMessage.textContent = error.message ||
                    "Could not create your account. Check the Supabase setup and try again.";
                console.error("Could not create account:", error);
            }
        });
    </script>
</body>

</html>
